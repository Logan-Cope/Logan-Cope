name: Latest videos

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh README from the YouTube feed
        run: python .github/scripts/update_videos.py
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "Logan Cope"
          git config user.email "61470040+Logan-Cope@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh latest videos"
          git push
